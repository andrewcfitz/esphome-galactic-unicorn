esphome:
  name: galactic-unicorn
  friendly_name: Galactic Unicorn

external_components:
  - source:
      type: local
      path: ../components

rp2040:
  board: rpipicow

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

font:
  - file: "gfonts://Roboto"
    id: sign_font
    size: 8

galactic_unicorn:
  id: unicorn
  brightness: 0.5

display:
  - platform: galactic_unicorn
    id: unicorn_display
    update_interval: 33ms
    lambda: |-
      it.print(0, 0, id(sign_font), Color(255, 180, 0), "hi");
